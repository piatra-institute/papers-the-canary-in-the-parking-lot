- id: src-appropriability
  kind: source
  passage: Appropriability is the share of the value something creates that its originator can capture,
    and the observation that returns follow appropriability rather than value created is the organising
    insight of the economics of innovation [@teece1986].
  evidence:
    citation_id: teece1986
    locator: Title and abstract
    verified: true
    verification_note: Crossref record verified against DOI 10.1016/0048-7333(86)90027-2. The concept
      and the claim that returns follow appropriability rather than value created are what the title and
      abstract establish; the article was not read at page level.
- id: src-organizational-slack
  kind: source
  passage: Organizational slack in the behavioural theory of the firm means resources held inside a firm
    in excess of what production requires, treated as a buffer against shocks or as evidence of agency
    problems [@cyert1963; @bourgeois1981].
  evidence:
    citation_id: bourgeois1981
    locator: Title
    verified: true
    verification_note: Crossref record verified against DOI 10.2307/257138. Cited, with cyert1963, only
      to distinguish a differently-referenced use of the same word; no finding is drawn from it.
- id: src-establishments
  kind: source
  passage: The relevant statutory category was a facility "principally engaged in selling food for consumption
    on the premises," and the court found that these establishments had "no tables and chairs, or counters,
    bars or stools... sufficient to accommodate any appreciable number of patrons," that "the service
    is geared to service in the customers' cars," that "customers are encouraged to consume the food off
    the premises by its service in disposable containers," and that half of what they sold was eaten elsewhere.
  evidence:
    citation_id: newman1966
    locator: Findings of fact 2; conclusions of law
    verified: true
    verification_note: District court opinion read in full from the Internet Archive capture of the Justia
      reproduction; citation, court, division, docket and date independently confirmed through the CourtListener
      search API. All quoted phrases were read in that text.
- id: src-kitchen-windows
  kind: source
  passage: The findings also record what the exemption was an exemption from.
  evidence:
    citation_id: newman1966
    locator: Finding of fact 4
    verified: true
    verification_note: Read in full in the same text. The quoted sentence about kitchen windows and consumption
      on the premises is verbatim from finding 4.
- id: src-reversal
  kind: source
  passage: The Court of Appeals reversed the refusal to enjoin discrimination at the drive-ins [@newman1967],
    and the Supreme Court, reaching the case on the separate question of attorney's fees, stated that
    the district court had "erroneously concluded that Title II does not cover drive-in restaurants of
    the sort involved in this case" [@newman1968].
  evidence:
    citation_id: newman1967
    locator: 377 F.2d 433, 435-436
    verified: true
    verification_note: The Fourth Circuit opinion itself was NOT obtained. Its holding is cited only as
      the Supreme Court recounts it at 390 U.S. 400, 401, and the sentence attributes it that way. Case
      name, citation, court and date were confirmed through CourtListener.
- id: src-scotus
  kind: source
  passage: The Court of Appeals reversed the refusal to enjoin discrimination at the drive-ins [@newman1967],
    and the Supreme Court, reaching the case on the separate question of attorney's fees, stated that
    the district court had "erroneously concluded that Title II does not cover drive-in restaurants of
