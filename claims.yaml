- id: assume-stipulated-functions
  kind: assumption
  passage: The model has ten functions whose footprints, social values and appropriabilities are stipulated
    and listed in full.
  rationale: The ten functions and their three numbers each are chosen for transparency, not estimated.
    A different itemisation of what a roadside site provides would give different magnitudes throughout.
    The ensemble perturbs footprints and appropriabilities but not the list of functions and not the functional
    forms.
- id: assume-appropriability
  kind: assumption
  passage: Appropriability is the central assumption, and no empirical estimate of it exists for any of
    these functions; the ensemble varies it but cannot validate it.
  rationale: No empirical estimate of the appropriability of any of these functions was found in the search
    recorded in research.md. The direction of the result follows from the argument that some of a site’s
    value is chargeable and some is not; every magnitude follows from numbers nobody has measured.
- id: assume-burden-parameters
  kind: assumption
  passage: 'Consider a meal occasion at a site reached by car, with three sources of burden: travel, food
    and the site itself.'
  rationale: 'The trip length, emission factor, site burden and food burden are stipulated, and no external
    emissions assessment is relied on anywhere in this paper. The sweep across 1482 combinations exists
    because the parameters are invented: the conclusion is that no combination in a wide range changes
    the answer, which is a weaker and safer claim than a calibrated estimate would be.'
- id: assume-ensemble-range
  kind: assumption
  passage: Because the ordering depends on stipulated numbers, it was tested with an ensemble in which
    every footprint and every appropriability was multiplied by an independent uniform factor between
    0.6 and 1.4, 800 times.
  rationale: A uniform factor in [0.6, 1.4] applied independently is a stipulated perturbation scale,
    wide enough to break a knife-edge result and narrow enough to keep the model interpretable. It is
    not a posterior and carries no probabilistic interpretation.
- id: define-appropriability-here
  kind: definition
  passage: Each function has a footprint in space and time, a social value, and an appropriability.
  rationale: Stipulative definition internal to the model. Private return is defined as appropriability
    times social value, so the two orderings are not independent constructions and the result is a statement
    about the variation in one parameter. Borrowing Teece’s term for the functions of a site rather than
    for an innovation is this paper’s extension.
- id: define-slack-distinct
  kind: definition
  passage: The capacity studied here lies outside the firm and benefits users, so results from that literature
    do not carry over.
  rationale: A terminological distinction, made to prevent an incorrect import. Organizational slack denotes
    resources held within a firm in excess of requirements; what this paper prices accrues to users and
    buffers nothing for the operator. No claim about the organizational-slack literature follows from
    anything computed here.
- id: interpret-generic-not-special
  kind: interpretation
  passage: The combination of lower social value and unchanged ecological burden is therefore the generic
    outcome for a site reached by car.
  rationale: 'An interpretation of the burden computation, not an additional result. It holds only for
    a site whose burden is dominated by travel and food, which is the stipulated case. A site reached
    on foot, or one whose own construction dominates, would not have this property, and the model says
    what it would take: a site burden some twenty-two times heavier.'
- id: interpret-incentive-survives-repudiation
  kind: interpretation
  passage: 'The reasoning was rejected, but the incentive it reveals remains wherever an obligation depends
    on a threshold of on-premises capacity: the model predicts that the cheapest response is to reduce
    capacity below the threshold, and the court record shows that response being argued.'
  rationale: 'An interpretation joining the documentary record to the model, and the paper’s most contestable
    move. The 1966 holding was reversed and called erroneous, so nothing here claims the exemption is
    available. The claim is structural: wherever a duty is keyed to a threshold of on-premises capacity,
    the model computes an incentive to fall below it, and the record shows that response being argued.'
- id: normative-capacity-not-building
  kind: normative
  passage: The results concern the capacity to stay, which a building, a car park or a vehicle may or
    may not provide.
  rationale: A normative position the authors take, not a result. The model ranks nothing and prefers
    nothing; it prices functions under a stipulated social value that someone had to choose. A reader
    who weighs these functions differently gets a different ordering, and the paper supplies the machinery
    rather than the weights.
