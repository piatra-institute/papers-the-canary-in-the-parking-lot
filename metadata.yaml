abstract: 'A drive-in can be criticised for what it consumes and mourned for what closes with it; the
  judgements differ because profitability, ecological cost and lived use are different measures. This
  paper computes what that separation implies. Each function of a site has a footprint, a social value,
  and an appropriability: the share of value the operator can charge for. Under rising ground rent functions
  are dropped in order of private yield per unit footprint, and the five constituting the capacity to
  remain are the first five dropped, while the thing a public evaluation would drop first is the parking
  the transaction requires. When appropriability is uniform the two orders are identical, which places
  the result in that one variable. The canary metaphor therefore acquires a number: nowhere is left to
  sit at a ground rent of 13.2 and the doors close at 81.9, and when the last seat goes the site still
  earns 0.588 of its peak profit while having lost 0.423 of its social value. Removing every way of staying
  reduces the site''s ecological burden by 0.0212, never by more than 0.0377 across 1482 sweep cells,
  because the burden belongs to journeys the operator neither pays for nor controls. Finally, a duty attaching
  to the capacity to remain is cheap to escape by removing it: a duty worth 0.0704 of private return buys
  the removal of 0.3226 of social value. That argument was made and accepted in a United States district
  court in 1966, then reversed.'
