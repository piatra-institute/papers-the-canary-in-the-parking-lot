- id: src-appropriability
  kind: source
  passage: The concept comes from the economics of innovation, where returns depend on appropriability
    as well as on the value created [@teece1986].
  evidence:
    citation_id: teece1986
    locator: Title and abstract
    verified: true
    verification_note: Crossref record verified against DOI 10.1016/0048-7333(86)90027-2. The concept
      and the claim that returns follow appropriability rather than value created are what the title and
      abstract establish; the article was not read at page level.
- id: src-organizational-slack
  kind: source
  passage: In organisational economics, slack refers to resources held within a firm beyond what production
    requires, usually treated as a buffer against shocks or as evidence of agency costs [@cyert1963; @bourgeois1981].
  evidence:
    citation_id: bourgeois1981
    locator: Title
    verified: true
    verification_note: Crossref record verified against DOI 10.2307/257138. Cited, with cyert1963, only
      to distinguish a differently-referenced use of the same word; no finding is drawn from it.
- id: src-establishments
  kind: source
  passage: The one establishment in the group with tables and chairs, a downtown sandwich shop, was held
    to be covered, and the five drive-ins were not [@newman1966].
  evidence:
    citation_id: newman1966
    locator: Findings of fact 2; conclusions of law
    verified: true
    verification_note: District court opinion read in full from the Internet Archive capture of the Justia
      reproduction; citation, court, division, docket and date independently confirmed through the CourtListener
      search API. All quoted phrases were read in that text.
- id: src-kitchen-windows
  kind: source
  passage: The court found that discrimination at all six establishments was uncontested and completely
