abstract: 'A drive-in restaurant can be criticised for its land and fuel use and regretted for the social
  uses lost when it closes. The two judgements concern different quantities: profitability, ecological
  cost and the uses a place supports. We model a site as a set of functions, each with a footprint, a
  social value and an appropriability, the share of its value the operator can charge for. Under rising
  ground rent an operator removes functions in order of private return per unit footprint. The five functions
  that let people remain on site are removed first, whereas an ordering by social value would first remove
  the parking the transaction requires. With uniform appropriability the two orders coincide. Seating
  disappears well before closure: the last way of staying is removed at a ground rent of 13.2 and the
  site closes at 81.9, and when the last seat goes the site still earns 0.588 of its peak profit while
  having lost 0.423 of its social value. Removing every way of staying reduces the ecological burden of
  a meal occasion by 0.0212, and by no more than 0.0377 across 1482 combinations of travel parameters,
  because most of the burden comes from travel the operator does not control. An obligation triggered
  by on-premises capacity can be avoided by removing that capacity: a duty worth 0.0704 of private return
  leads to the removal of 0.3226 of social value. A United States district court accepted an exemption
  on this basis in 1966, and it was reversed on appeal.'
